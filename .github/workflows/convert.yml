name: Convert WebM to MOV (HEVC Alpha)

on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: 'Google Drive Folder ID'
        required: true
        type: string
      batch_name:
        description: 'Batch name for artifact (e.g. batch_01)'
        required: true
        type: string

jobs:
  convert:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ffmpeg pipx
          pipx install gdown
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download batch from Google Drive
        run: |
          gdown --folder "https://drive.google.com/drive/folders/${{ github.event.inputs.folder_id }}" \
                --output webm_3

      - name: Run conversion script
        run: python3 convert_mac.py

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mov_${{ github.event.inputs.batch_name }}
          path: mov_output/
          retention-days: 7
