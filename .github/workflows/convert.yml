name: Convert WebM to MOV (HEVC Alpha)

on:
  workflow_dispatch:
    inputs:
      batch_name:
        description: 'اسم المجلد داخل Drive (مثال: batch_01)'
        required: true
        type: string

jobs:
  convert:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ffmpeg pipx
          pipx install gdown
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download batch from Google Drive
        run: |
          # تحميل المجلد الرئيسي كاملاً ثم نأخذ المجلد المطلوب فقط
          gdown --folder "https://drive.google.com/drive/folders/1m6ghpKQvonIaJHwrIPbFyDqJ9KbsbHNX" \
                --output webm_batches
          # ننقل الملفات من المجلد المحدد إلى webm_3
          mv "webm_batches/${{ github.event.inputs.batch_name }}" webm_3

      - name: Run conversion script
        run: python3 convert_mac.py

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mov_${{ github.event.inputs.batch_name }}
          path: mov_output/
          retention-days: 7
